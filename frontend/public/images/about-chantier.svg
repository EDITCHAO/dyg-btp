<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond dégradé professionnel -->
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a4f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5f7f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0c674;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad2)"/>
  
  <!-- Grille subtile -->
  <line x1="0" y1="100" x2="600" y2="100" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="0" y1="200" x2="600" y2="200" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="150" y1="0" x2="150" y2="400" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="400" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="450" y1="0" x2="450" y2="400" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Icône chantier (bâtiment + grue) -->
  <g transform="translate(250, 100)">
    <!-- Grue -->
    <line x1="50" y1="0" x2="50" y2="100" stroke="#d4af37" stroke-width="6"/>
    <line x1="50" y1="10" x2="120" y2="10" stroke="#d4af37" stroke-width="4"/>
    <line x1="120" y1="10" x2="120" y2="40" stroke="#f0c674" stroke-width="3"/>
    <rect x="115" y="40" width="10" height="15" fill="#ffffff"/>
    
    <!-- Bâtiment en construction -->
    <rect x="-60" y="30" width="80" height="100" fill="rgba(255,255,255,0.2)" stroke="#ffffff" stroke-width="3"/>
    <rect x="-50" y="45" width="15" height="15" fill="#d4af37"/>
    <rect x="-25" y="45" width="15" height="15" fill="#d4af37"/>
    <rect x="-50" y="70" width="15" height="15" fill="#d4af37"/>
    <rect x="-25" y="70" width="15" height="15" fill="#d4af37"/>
    <rect x="-50" y="95" width="15" height="15" fill="#d4af37"/>
    <rect x="-25" y="95" width="15" height="15" fill="#d4af37"/>
    
    <!-- Sol -->
    <rect x="-100" y="130" width="250" height="6" fill="url(#accentGrad2)" rx="1"/>
  </g>
  
  <!-- Barre décorative -->
  <rect x="50" y="250" width="500" height="4" fill="url(#accentGrad2)" rx="2"/>
  
  <!-- Texte -->
  <text x="300" y="290" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">CHANTIER ACTIF</text>
  <text x="300" y="320" font-family="Arial, sans-serif" font-size="16" fill="#d4af37" text-anchor="middle">Suivi & Contrôle Technique · ISO 9001:2015</text>
  <text x="300" y="350" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.7)" text-anchor="middle">Photo de chantier en activité recommandée</text>
  <text x="300" y="370" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">600x400px · JPG ou PNG</text>
</svg>
