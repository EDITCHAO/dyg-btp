<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond dégradé professionnel -->
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5f7f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a4f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0c674;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad1)"/>
  
  <!-- Grille subtile -->
  <line x1="0" y1="100" x2="600" y2="100" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="0" y1="200" x2="600" y2="200" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="150" y1="0" x2="150" y2="400" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="400" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="450" y1="0" x2="450" y2="400" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Icône équipe (3 personnes) -->
  <g transform="translate(250, 120)">
    <!-- Personne 1 -->
    <circle cx="0" cy="0" r="25" fill="url(#accentGrad)"/>
    <rect x="-20" y="30" width="40" height="50" rx="5" fill="#ffffff" opacity="0.9"/>
    
    <!-- Personne 2 -->
    <circle cx="-50" cy="10" r="22" fill="rgba(255,255,255,0.8)"/>
    <rect x="-68" y="37" width="36" height="45" rx="5" fill="#ffffff" opacity="0.7"/>
    
    <!-- Personne 3 -->
    <circle cx="50" cy="10" r="22" fill="rgba(255,255,255,0.8)"/>
    <rect x="32" y="37" width="36" height="45" rx="5" fill="#ffffff" opacity="0.7"/>
  </g>
  
  <!-- Barre décorative -->
  <rect x="50" y="250" width="500" height="4" fill="url(#accentGrad)" rx="2"/>
  
  <!-- Texte -->
  <text x="300" y="290" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">ÉQUIPE DYG-BTP</text>
  <text x="300" y="320" font-family="Arial, sans-serif" font-size="16" fill="#d4af37" text-anchor="middle">Ingénieurs Conseils · Excellence & Innovation</text>
  <text x="300" y="350" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.7)" text-anchor="middle">Photo d'équipe professionnelle recommandée</text>
  <text x="300" y="370" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">600x400px · JPG ou PNG</text>
</svg>
