<svg width="320" height="180" viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="buildingGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2855;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e7f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d4fb8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5066d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e7f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d4fb8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Bâtiment gauche (grand, foncé) -->
  <path d="M 40 45 L 75 30 L 75 95 L 40 110 Z" fill="url(#buildingGrad1)"/>
  <path d="M 75 30 L 100 40 L 100 105 L 75 95 Z" fill="url(#buildingGrad3)"/>
  <rect x="50" y="55" width="8" height="10" fill="#fff" opacity="0.3"/>
  <rect x="62" y="55" width="8" height="10" fill="#fff" opacity="0.3"/>
  <rect x="50" y="70" width="8" height="10" fill="#fff" opacity="0.3"/>
  <rect x="62" y="70" width="8" height="10" fill="#fff" opacity="0.3"/>
  <rect x="82" y="55" width="6" height="8" fill="#fff" opacity="0.3"/>
  <rect x="90" y="55" width="6" height="8" fill="#fff" opacity="0.3"/>
  <rect x="82" y="68" width="6" height="8" fill="#fff" opacity="0.3"/>
  <rect x="90" y="68" width="6" height="8" fill="#fff" opacity="0.3"/>
  
  <!-- Petite maison avec toit (centre-gauche) -->
  <polygon points="105,70 125,60 145,70" fill="#667" opacity="0.8"/>
  <rect x="105" y="70" width="40" height="40" fill="url(#buildingGrad3)"/>
  <rect x="115" y="80" width="7" height="9" fill="#fff" opacity="0.4"/>
  <rect x="128" y="80" width="7" height="9" fill="#fff" opacity="0.4"/>
  <rect x="115" y="95" width="7" height="9" fill="#fff" opacity="0.4"/>
  <rect x="128" y="95" width="7" height="9" fill="#fff" opacity="0.4"/>
  <!-- Fenêtre spéciale (deux carreaux) -->
  <rect x="120" y="85" width="5" height="5" fill="#3d4fb8"/>
  <rect x="126" y="85" width="5" height="5" fill="#5066d9"/>
  
  <!-- Bâtiment droit (grand, avec lignes verticales) -->
  <rect x="155" y="40" width="50" height="70" fill="url(#buildingGrad2)"/>
  <line x1="162" y1="45" x2="162" y2="105" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
  <line x1="170" y1="45" x2="170" y2="105" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
  <line x1="178" y1="45" x2="178" y2="105" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
  <line x1="186" y1="45" x2="186" y2="105" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
  <line x1="194" y1="45" x2="194" y2="105" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Ligne de base / sol -->
  <line x1="30" y1="115" x2="215" y2="115" stroke="#667" stroke-width="2.5"/>
  
  <!-- Texte DYG BTP -->
  <text x="30" y="155" font-family="'Arial Black', Arial, sans-serif" font-size="48" font-weight="900" fill="#1a2855" letter-spacing="-1">DYG BTP</text>
  
  <!-- Ligne décorative sous le texte -->
  <line x1="30" y1="165" x2="290" y2="165" stroke="#1a2855" stroke-width="2"/>
  
</svg>
